apply plugin: 'com.android.application'
//apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.quanutrition.app"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 14
        versionName "1.0.5.9"
        buildFeatures {
            dataBinding true
            viewBinding true
            compose true
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"https://api.logikcal.in/\""
            buildConfigField "String", "TEST_TOKEN","\"NO\""
            buildConfigField "String", "HEALTH_CONNECT", "\"NO\""  // please comment out steps and calories permissions
            buildConfigField "String", "TOKEN", "\"\""
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"https://api.logikcal.in/\""
            buildConfigField "String", "TEST_TOKEN","\"NO\""
            buildConfigField "String", "HEALTH_CONNECT", "\"NO\""  // please comment out steps and calories permissions
            buildConfigField "String", "TOKEN", "\"\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
    namespace 'com.quanutrition.app'
}

